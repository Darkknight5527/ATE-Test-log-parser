# Builds the Windows app on GitHub's Windows machine.
#  - every push to main: tests + build, zip kept as an artifact (Actions tab) for 30 days
#  - a version tag (e.g. v0.3.0): also creates a GitHub Release with the zip attached (what users download)
name: Build Windows app

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_NAME: ATE_Log_Parser
  ENTRY: app/main.py

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest
      - name: Data-safety check (no datalogs / reports / profiles in the repo)
        run: python tools/check_repo_clean.py --all
      - name: Tests (synthetic STDF only)
        run: python -m pytest -q tests
      - name: Build app
        run: python -m PyInstaller --noconfirm --clean --onedir --windowed --paths . --paths app --hidden-import gui --add-data "app/ui;ui" --name ${{ env.APP_NAME }} ${{ env.ENTRY }}
      - name: Package
        shell: pwsh
        run: |
          $ver = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { "dev-" + $env:GITHUB_SHA.Substring(0,7) }
          Copy-Item README.md dist/${{ env.APP_NAME }}/
          Copy-Item examples/example_profile.json dist/${{ env.APP_NAME }}/
          Compress-Archive -Path dist/${{ env.APP_NAME }}/* -DestinationPath "${{ env.APP_NAME }}-$ver-windows.zip"
          echo "ZIP=${{ env.APP_NAME }}-$ver-windows.zip" >> $env:GITHUB_ENV
      - uses: actions/upload-artifact@v5
        with:
          name: ${{ env.ZIP }}
          path: ${{ env.ZIP }}
          retention-days: 30
      - name: Publish release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP }}
          generate_release_notes: true
